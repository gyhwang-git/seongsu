<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성수동 건축물 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --hover: rgba(11,11,11,0.05);
  --accent: #2a78d6;
  /* 승인연도 순서형 램프(파랑 250→650, 검증 통과): 최근 → 오래됨 */
  --c0: #86b6ef; --c1: #5598e7; --c2: #2a78d6; --c3: #1c5cab; --c4: #104281;
  --unknown: #85847e;
  /* 건축물 용도 범주형 팔레트(고정 순서 7색, 검증 통과) */
  --u1: #2a78d6; --u2: #eb6834; --u3: #1baf7a; --u4: #eda100; --u5: #e87ba4; --u6: #008300; --u7: #6250d6;
  --uetc: #5f5e5a;
  --newer: #cfcec7;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
    --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
  --accent: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
.app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; height: 100dvh; }
#map { height: 100%; background: var(--page); }
.panel { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 4px 0 0; font-size: 13px; }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.legend { display: flex; flex-direction: column; gap: 2px; }
.lg { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.lg:hover { background: var(--hover); }
.lg .sw { width: 16px; height: 16px; border-radius: 4px; }
.lg .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.lg[aria-pressed="false"] { opacity: .4; }
.lg[aria-pressed="false"] .sw { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.lg .sw.hollow { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--unknown); }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.h2row { display: flex; justify-content: space-between; align-items: baseline; }
.h2row h2 { margin: 0 0 8px; }
.links button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0 0 0 8px; }
.links button:hover { text-decoration: underline; }
.lg .sw.dashed { background: transparent !important; box-shadow: none; border: 1.5px dashed var(--unknown); }
.hero { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
.hero b { font-size: 22px; font-weight: 650; color: var(--ink); margin-right: 1px; }
.hero span { display: block; font-size: 12px; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid var(--border); margin: 14px -20px 0; padding: 0 20px; }
.tab { border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink-2); padding: 9px 0 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.hbar { display: grid; grid-template-columns: 118px 1fr 74px; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; position: relative; }
.hbar .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { height: 12px; position: relative; }
.hbar .bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hbar .val small { color: var(--muted); font-size: 11px; }
.hbar.off { opacity: .35; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 5; }
.tip b { font-weight: 600; }
details { border-top: 1px solid var(--border); padding-top: 14px; }
summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 4px; text-align: right; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
.base { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.base .chip { border-radius: 6px; padding: 5px 0; text-align: center; }
.note { font-size: 12px; color: var(--ink-2); margin: 0; }
.note + .note { margin-top: 6px; }
.warn { border: 1px solid var(--border); background: var(--hover); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); }
.warn code { font-size: 12px; }
.src { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; margin-top: auto; }
.src a { color: inherit; }
/* 지도 위 요소 */
.leaflet-container { font: inherit; }
.tiles-gray { filter: grayscale(1) contrast(.68) brightness(1.14); }
.tiles-dark { filter: invert(1) hue-rotate(180deg) grayscale(.85) brightness(.85) contrast(.9); }
.leaflet-tooltip.btip { background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
.leaflet-tooltip.btip::before { display: none; }
.btip .t { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.btip .r { display: flex; gap: 10px; justify-content: space-between; }
.btip .r span:first-child { color: var(--muted); }
.leaflet-tooltip.dlabel { background: rgba(255,255,255,.85); border: 0; box-shadow: none; color: #0b0b0b; font-weight: 650; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.leaflet-tooltip.dlabel::before { display: none; }
.leaflet-control-attribution { font-size: 10.5px; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; height: auto; }
  .panel { min-width: 0; }
  #map { height: 58vh; order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--border); overflow: visible; padding: 18px 16px 24px; }
  .tabs { margin: 14px -16px 0; padding: 0 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <h1>성수동 건축물 지도</h1>
      <p class="sub" id="sub">성수1가1동 · 성수1가2동 · 성수2가1동 · 성수2가3동</p>
      <div class="tabs" role="tablist" aria-label="지도 주제">
        <button class="tab" role="tab" id="tab-year" data-mode="year" aria-selected="true">사용승인연도</button>
        <button class="tab" role="tab" id="tab-use" data-mode="use" aria-selected="false">건축물 용도</button>
        <button class="tab" role="tab" id="tab-old" data-mode="old" aria-selected="false">30년 이상 노후</button>
      </div>
    </header>

    <section>
      <h2>행정동</h2>
      <div class="chips" id="dongs" role="group" aria-label="행정동 선택"></div>
    </section>

    <section role="tabpanel" aria-labelledby="tab-year">
      <div class="h2row"><h2 id="legendTitle">사용승인연도</h2><span class="links"><button id="allOn">모두 켜기</button><button id="allOff">모두 끄기</button></span></div>
      <div class="legend" id="legend"></div>
      <p class="hint">항목을 눌러 지도에서 켜고 끕니다. ‘모두 끄기’ 후 하나를 누르면 그 항목만 볼 수 있습니다.</p>
    </section>

    <section>
      <h2 id="chartTitle">10년 단위 건물 수</h2>
      <div class="chart" id="chart"><div class="tip" id="ctip"></div></div>
    </section>

    <details>
      <summary>행정동별 표로 보기</summary>
      <div id="table"></div>
    </details>

    <section>
      <h2>배경지도</h2>
      <div class="base" id="base" role="group" aria-label="배경지도"></div>
    </section>

    <section>
      <p class="note" id="note"></p>
      <p class="note" id="caveat"></p>
    </section>

    <footer class="src" id="src"></footer>
  </aside>
  <div id="map" aria-label="성수동 건축물 지도"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/seongsu_data.js"></script>
<script>
(() => {
  const D = window.SEONGSU;
  const F = D.buildings.features;
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const nf = (n) => n.toLocaleString('ko-KR');
  const fmtDay = (d) => (d && d.length === 8 ? `${d.slice(0, 4)}.${d.slice(4, 6)}.${d.slice(6)}` : d || '—');

  const DONGS = ['성수1가1동', '성수1가2동', '성수2가1동', '성수2가3동'];
  const USE = { '01000': '단독주택', '02000': '공동주택', '03000': '제1종 근린생활시설', '04000': '제2종 근린생활시설', '05000': '문화 및 집회시설', '06000': '종교시설', '07000': '판매시설', '08000': '운수시설', '09000': '의료시설', '10000': '교육연구시설', '11000': '노유자시설', '12000': '수련시설', '13000': '운동시설', '14000': '업무시설', '15000': '숙박시설', '16000': '위락시설', '17000': '공장', '18000': '창고시설', '19000': '위험물 저장·처리시설', '20000': '자동차 관련 시설', '21000': '동물·식물 관련 시설', '22000': '자원순환 관련 시설', '23000': '교정시설', '24000': '국방·군사시설', '25000': '방송통신시설', '26000': '발전시설', '27000': '묘지 관련 시설', '28000': '관광 휴게시설', '29000': '장례시설' };

  // ── 두 주제의 구간 정의. hollow = 채우지 않고 외곽선만(정보 없음)
  const MODES = {
    year: {
      title: '사용승인연도', chartTitle: '10년 단위 건물 수',
      note: '사용승인일은 건축물대장의 사용승인일(useapr_day) 기준이며, 건물 색은 그 연도의 구간입니다.',
      classes: [
        { id: 'y4', label: '1969년 이전', v: '--c4', test: (p) => p.y && p.y <= 1969 },
        { id: 'y3', label: '1970–1979년', v: '--c3', test: (p) => p.y >= 1970 && p.y <= 1979 },
        { id: 'y2', label: '1980–1989년', v: '--c2', test: (p) => p.y >= 1980 && p.y <= 1989 },
        { id: 'y1', label: '1990–1999년', v: '--c1', test: (p) => p.y >= 1990 && p.y <= 1999 },
        { id: 'y0', label: '2000년 이후', v: '--c0', test: (p) => p.y >= 2000 },
        { id: 'yn', label: '승인일 정보 없음', v: '--unknown', test: () => true },
      ],
    },
    use: {
      title: '건축물 주용도', chartTitle: '용도별 건물 수',
      note: '주용도는 건축물대장 주용도 코드의 대분류 기준이며, 비슷한 용도를 묶었습니다. 제1·2종 근린생활시설은 하나로 합쳤습니다.',
      classes: [
        { id: 'u1', label: '단독주택', v: '--u1', codes: ['01000'] },
        { id: 'u2', label: '근린생활시설', v: '--u2', codes: ['03000', '04000'] },
        { id: 'u3', label: '공장', v: '--u3', codes: ['17000'] },
        { id: 'u4', label: '공동주택', v: '--u4', codes: ['02000'] },
        { id: 'u5', label: '업무·숙박·판매', v: '--u5', codes: ['14000', '15000', '07000', '16000'] },
        { id: 'u6', label: '창고·자동차·위험물', v: '--u6', codes: ['18000', '20000', '19000', '08000'] },
        { id: 'u7', label: '교육·의료·복지·종교·문화', v: '--u7', codes: ['10000', '09000', '11000', '06000', '05000', '12000', '13000'] },
        { id: 'ue', label: '기타', v: '--uetc', test: (p) => !!p.u },
        { id: 'un', label: '용도 정보 없음', v: '--unknown', hollow: true, test: () => true },
      ],
    },
  };
  for (const m of Object.values(MODES)) for (const c of m.classes) if (c.codes) c.test = (p) => c.codes.includes(p.u);

  // 30년 이상 노후 건물 × 용도: 올해 기준 사용승인 후 30년 이상(승인연도 ≤ CUT)만 용도 색, 나머지는 흐리게
  const REF = new Date().getFullYear(), CUT = REF - 30;
  const isOld = (p) => !!p.y && p.y <= CUT;
  MODES.old = {
    title: `30년 이상 건물의 용도`, chartTitle: '용도별 30년 이상 건물 수 · 노후 비율',
    note: `${REF}년 기준 사용승인 후 30년 이상(${CUT}년 이전 승인)인 건물만 용도별로 색칠하고, 30년 미만 건물은 회색으로 흐리게 표시합니다. 노후 비율은 승인연도가 있는 건물 중 30년 이상인 건물의 비율입니다.`,
    classes: [
      ...MODES.use.classes.map((c) => ({ ...c, id: 'o' + c.id, base: c.id, test: (p) => isOld(p) && c.test(p) })),
      { id: 'onew', label: `30년 미만 (${CUT + 1}년 이후)`, v: '--newer', muted: true, test: (p) => !!p.y },
      { id: 'onull', label: '승인연도 정보 없음', v: '--unknown', dashed: true, test: () => true },
    ],
  };
  MODES.old.classes.find((c) => c.id === 'oun').label = '용도 정보 없음 (30년 이상)';

  // 각 건물의 구간을 미리 계산
  const clsKey = { year: 'cy', use: 'cu', old: 'co' };
  for (const f of F) for (const [m, k] of Object.entries(clsKey)) f.properties[k] = MODES[m].classes.find((c) => c.test(f.properties)).id;
  const ALL = Object.values(MODES).flatMap((m) => m.classes);
  const cls = (id) => ALL.find((c) => c.id === id);

  const hashMode = location.hash.slice(1);
  const state = { mode: MODES[hashMode] ? hashMode : 'year', dong: null, off: { year: new Set(), use: new Set(), old: new Set() } };
  const cur = () => MODES[state.mode];
  const cOf = (p) => p[clsKey[state.mode]];

  // ── 지도
  const map = L.map('map', { preferCanvas: true, zoomControl: true, minZoom: 12, maxZoom: 19, zoomSnap: 0.25 });
  // 배경지도: 모두 인증키가 필요 없는 공개 타일
  // 회색·어두운 지도는 OSM 타일에 CSS 필터를 입힌 것
  const OSM_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const OSM = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자';
  const BASES = [
    { id: 'light', label: '회색', dark: false, url: OSM_URL, attribution: OSM, maxNativeZoom: 19, className: 'tiles-gray' },
    { id: 'osm', label: '일반', dark: false, url: OSM_URL, attribution: OSM, maxNativeZoom: 19 },
    { id: 'dark', label: '어두운', dark: true, url: OSM_URL, attribution: OSM, maxNativeZoom: 19, className: 'tiles-dark' },
    { id: 'sat', label: '위성', dark: true, url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles © Esri — Esri, Maxar, Earthstar Geographics', maxNativeZoom: 18 },
  ];
  let baseLayer = null, labelLayer = null, baseId = 'light';
  const dark = () => BASES.find((b) => b.id === baseId).dark;
  function setBase(id) {
    baseId = id;
    if (baseLayer) map.removeLayer(baseLayer);
    if (labelLayer) map.removeLayer(labelLayer);
    document.querySelectorAll('#base .chip').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.id === id)));
    const b = BASES.find((x) => x.id === id);
    baseLayer = L.tileLayer(b.url, { maxZoom: 19, maxNativeZoom: b.maxNativeZoom, attribution: b.attribution, className: b.className || '' }).addTo(map);
    baseLayer.bringToBack();
    styleAll();
  }

  function bStyle(f) {
    const p = f.properties, c = cls(cOf(p));
    const visible = !state.off[state.mode].has(c.id) && (!state.dong || state.dong === p.d);
    if (!visible) return { fillOpacity: 0, opacity: 0, weight: 0 };
    if (c.hollow) return { fillColor: css(c.v), fillOpacity: 0.08, color: dark() ? '#d9d8d2' : css(c.v), weight: 1, opacity: 0.9 };
    if (c.dashed) return { fillOpacity: 0, color: dark() ? '#bdbcb5' : css(c.v), weight: 0.8, opacity: 0.8, dashArray: '2 2' };
    if (c.muted) return { fillColor: dark() ? '#9a9993' : css(c.v), fillOpacity: dark() ? 0.35 : 0.55, color: dark() ? 'rgba(0,0,0,.4)' : '#ffffff', weight: 0.4, opacity: 1 };
    return { fillColor: css(c.v), fillOpacity: c.v === '--unknown' ? 0.7 : 0.9, color: dark() ? 'rgba(0,0,0,.6)' : '#ffffff', weight: 0.6, opacity: 1 };
  }
  const bLayer = L.geoJSON(D.buildings, {
    style: bStyle,
    onEachFeature(f, layer) {
      layer.bindTooltip(() => {
        const p = f.properties;
        const name = p.n || (USE[p.u] ?? '건물');
        const rows = [
          ['사용승인일', fmtDay(p.day)],
          ['승인연도 구간', cls(p.cy).label],
          p.y ? ['승인 후 경과', `${REF - p.y}년${isOld(p) ? ' (30년 이상)' : ''}`] : null,
          ['주용도', USE[p.u] || '정보 없음'],
          ['용도 분류', cls(p.cu).label],
          ['층수', p.f || p.b ? `지상 ${p.f}층${p.b ? ` · 지하 ${p.b}층` : ''}` : '정보 없음'],
          p.a ? ['연면적', nf(p.a) + '㎡'] : null,
          ['행정동', p.d],
        ].filter(Boolean);
        return `<div class="t">${name.replace(/</g, '&lt;')}</div>` + rows.map(([k, v]) => `<div class="r"><span>${k}</span><span>${v}</span></div>`).join('');
      }, { className: 'btip', sticky: true, direction: 'top', offset: [0, -8] });
      layer.on('mouseover', () => { if (bStyle(f).opacity) layer.setStyle({ weight: 2.5, color: css('--ink'), opacity: 1 }); });
      layer.on('mouseout', () => layer.setStyle(bStyle(f)));
    },
  }).addTo(map);

  const dLayer = L.geoJSON(D.dong, {
    interactive: false,
    style: (f) => ({ fill: false, color: dark() ? '#ffffff' : '#0b0b0b', weight: state.dong === f.properties.adm_nm ? 3 : 1.6, dashArray: '5 4', opacity: state.dong && state.dong !== f.properties.adm_nm ? 0.35 : 0.85 }),
    onEachFeature(f, layer) { layer.bindTooltip(f.properties.adm_nm, { permanent: true, direction: 'center', className: 'dlabel' }); },
  }).addTo(map);
  // 행정동 경계는 한강까지 포함하므로, 처음 화면과 동 선택 시에는 건물 범위에 맞춘다
  const bldgBounds = (d) => L.latLngBounds(bLayer.getLayers().filter((l) => !d || l.feature.properties.d === d).map((l) => l.getBounds()));
  map.fitBounds(bldgBounds(), { padding: [16, 16] });
  function styleAll() { bLayer.setStyle(bStyle); dLayer.setStyle((f) => dLayer.options.style(f)); }

  // ── 탭
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t) => (t.onclick = () => setMode(t.dataset.mode)));
  function setMode(m) {
    state.mode = m;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.mode === m)));
    document.querySelector('[role=tabpanel]').setAttribute('aria-labelledby', 'tab-' + m);
    try { history.replaceState(null, '', location.pathname + location.search + (m === 'year' ? '' : '#' + m)); } catch (e) {}
    buildLegend(); drawTable(); render();
  }

  // ── 행정동 칩
  const dongBox = document.getElementById('dongs');
  for (const d of [null, ...DONGS]) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = d || '전체'; b.setAttribute('aria-pressed', String(d === null));
    b.onclick = () => {
      state.dong = d;
      dongBox.querySelectorAll('.chip').forEach((el) => el.setAttribute('aria-pressed', String(el === b)));
      map.fitBounds(bldgBounds(d), { padding: [24, 24] });
      render();
    };
    dongBox.append(b);
  }

  // ── 범례(필터 겸용)
  const legend = document.getElementById('legend');
  function buildLegend() {
    legend.innerHTML = '';
    document.getElementById('legendTitle').textContent = cur().title;
    for (const c of cur().classes) {
      const b = document.createElement('button');
      b.className = 'lg'; b.dataset.c = c.id; b.setAttribute('aria-pressed', String(!state.off[state.mode].has(c.id)));
      b.innerHTML = `<span class="sw${c.hollow ? ' hollow' : ''}${c.dashed ? ' dashed' : ''}" style="background:var(${c.v})"></span><span>${c.label}</span><span class="n"></span>`;
      b.onclick = () => { const off = state.off[state.mode]; off.has(c.id) ? off.delete(c.id) : off.add(c.id); render(); };
      legend.append(b);
    }
  }
  document.getElementById('allOn').onclick = () => { state.off[state.mode].clear(); render(); };
  document.getElementById('allOff').onclick = () => { cur().classes.forEach((c) => state.off[state.mode].add(c.id)); render(); };

  // ── 배경지도 선택
  const baseBox = document.getElementById('base');
  for (const b of BASES) {
    const el = document.createElement('button');
    el.className = 'chip'; el.dataset.id = b.id; el.textContent = b.label;
    el.onclick = () => setBase(b.id);
    baseBox.append(el);
  }

  // ── 차트
  const chart = document.getElementById('chart'), ctip = document.getElementById('ctip');
  const ys = F.map((f) => f.properties.y).filter(Boolean);
  const dec0 = Math.floor(Math.min(...ys) / 10) * 10, dec1 = Math.floor(Math.max(...ys) / 10) * 10;
  const DECS = []; for (let d = dec0; d <= dec1; d += 10) DECS.push(d);
  const niceStep = (x) => { const p = 10 ** Math.floor(Math.log10(x || 1)); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
  function showTip(el, html) {
    ctip.innerHTML = html;
    const box = chart.getBoundingClientRect(), rb = el.getBoundingClientRect();
    ctip.style.left = Math.min(box.width - 130, Math.max(0, rb.left - box.left + rb.width / 2 - 60)) + 'px';
    ctip.style.top = rb.top - box.top - 34 + 'px'; ctip.style.opacity = 1;
  }
  function clearChart() { chart.querySelectorAll('svg, .hbars').forEach((e) => e.remove()); }

  // 승인연도: 10년 단위 세로 막대(단일 계열, 막대 색 = 해당 연대의 구간 색)
  function drawDecades(feats) {
    const counts = DECS.map((d) => feats.filter((f) => f.properties.y && Math.floor(f.properties.y / 10) * 10 === d).length);
    const W = 320, H = 150, padL = 34, padB = 20, padT = 8, iw = W - padL, ih = H - padB - padT;
    const max = Math.max(...counts, 1), step = niceStep(max / 3), top = Math.ceil(max / step) * step;
    const bw = iw / DECS.length, gap = 2;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="10년 단위 사용승인 건물 수">`;
    for (let v = 0; v <= top; v += step) { const y = padT + ih - (v / top) * ih; s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(${v ? '--grid' : '--axis'})" stroke-width="1"/><text x="${padL - 6}" y="${y + 3.5}" text-anchor="end">${nf(v)}</text>`; }
    DECS.forEach((d, i) => {
      const h = (counts[i] / top) * ih, x = padL + i * bw + gap / 2, y = padT + ih - h, w = bw - gap, r = Math.min(4, w / 2, h);
      const c = MODES.year.classes.find((k) => k.test({ y: d + 5 }));
      const on = !state.off.year.has(c.id);
      if (h > 0) s += `<path d="M${x},${padT + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${padT + ih} Z" fill="var(${c.v})" opacity="${on ? 1 : 0.25}"/>`;
      if (i % 2 === 0) s += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${d}</text>`;
      s += `<rect class="hit" data-i="${i}" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent"/>`;
    });
    clearChart();
    chart.insertAdjacentHTML('afterbegin', s + '</svg>');
    chart.querySelectorAll('.hit').forEach((r) => {
      r.addEventListener('mouseenter', () => showTip(r, `<b>${DECS[+r.dataset.i]}년대</b> · ${nf(counts[+r.dataset.i])}동`));
      r.addEventListener('mouseleave', () => (ctip.style.opacity = 0));
    });
  }

  // 용도: 가로 막대(값·비율 직접 표기)
  function drawUses(feats) {
    const rows = MODES.use.classes.map((c) => ({ c, n: feats.filter((f) => f.properties.cu === c.id).length }));
    const max = Math.max(...rows.map((r) => r.n), 1), tot = feats.length || 1;
    clearChart();
    const box = document.createElement('div'); box.className = 'hbars';
    box.innerHTML = rows.map(({ c, n }) => `<div class="hbar${state.off.use.has(c.id) ? ' off' : ''}" data-c="${c.id}">
      <span class="lab" title="${c.label}">${c.label}</span>
      <span class="track"><span class="bar" style="width:${(n / max) * 100}%;${c.hollow ? 'background:transparent;box-shadow:inset 0 0 0 1.5px var(--unknown)' : `background:var(${c.v})`}"></span></span>
      <span class="val">${nf(n)} <small>${((n / tot) * 100).toFixed(1)}%</small></span></div>`).join('');
    chart.prepend(box);
    box.querySelectorAll('.hbar').forEach((el) => {
      const r = rows.find((x) => x.c.id === el.dataset.c);
      const codes = (r.c.codes || []).map((k) => USE[k]).join(', ');
      el.addEventListener('mouseenter', () => { if (codes) showTip(el.querySelector('.track'), `<b>${r.c.label}</b><br>${codes}`); });
      el.addEventListener('mouseleave', () => (ctip.style.opacity = 0));
    });
  }

  // 노후 × 용도: 가로 막대 = 30년 이상 건물 수, 오른쪽에 노후 비율(승인연도 있는 건물 중)
  function drawOld(feats) {
    const rows = MODES.use.classes.map((c) => {
      const all = feats.filter((f) => f.properties.cu === c.id), known = all.filter((f) => f.properties.y);
      return { c, all: all.length, known: known.length, old: known.filter((f) => isOld(f.properties)).length };
    });
    const max = Math.max(...rows.map((r) => r.old), 1);
    const known = feats.filter((f) => f.properties.y).length, old = feats.filter((f) => isOld(f.properties)).length;
    const rate = (a, b) => (b ? ((a / b) * 100).toFixed(1) + '%' : '—');
    clearChart();
    const box = document.createElement('div'); box.className = 'hbars';
    box.innerHTML = `<p class="hero"><b>${nf(old)}</b>동 <span>승인연도 있는 건물 ${nf(known)}동 중 ${rate(old, known)}</span></p>` +
      rows.map(({ c, old: n, known: k }) => `<div class="hbar${state.off.old.has('o' + c.id) ? ' off' : ''}" data-c="${c.id}">
      <span class="lab" title="${c.label}">${c.label}</span>
      <span class="track"><span class="bar" style="width:${(n / max) * 100}%;${c.hollow ? 'background:transparent;box-shadow:inset 0 0 0 1.5px var(--unknown)' : `background:var(${c.v})`}"></span></span>
      <span class="val">${nf(n)} <small>${rate(n, k)}</small></span></div>`).join('');
    chart.prepend(box);
    box.querySelectorAll('.hbar').forEach((el) => {
      const r = rows.find((x) => x.c.id === el.dataset.c);
      el.addEventListener('mouseenter', () => showTip(el.querySelector('.track'), `<b>${r.c.label}</b> 전체 ${nf(r.all)}동<br>승인연도 있음 ${nf(r.known)}동 중 30년 이상 ${nf(r.old)}동 (${rate(r.old, r.known)})`));
      el.addEventListener('mouseleave', () => (ctip.style.opacity = 0));
    });
  }

  // ── 표
  function drawTable() {
    const k = clsKey[state.mode];
    const cnt = (d, c) => F.filter((f) => (!d || f.properties.d === d) && (c === undefined || f.properties[k] === c)).length;
    let h = `<table><thead><tr><th>${state.mode === 'year' ? '구간' : '용도'}</th>` + DONGS.map((d) => `<th>${d.replace('성수', '')}</th>`).join('') + '<th>합계</th></tr></thead><tbody>';
    for (const c of cur().classes) h += `<tr><td>${c.label}</td>` + DONGS.map((d) => `<td>${nf(cnt(d, c.id))}</td>`).join('') + `<td>${nf(cnt(null, c.id))}</td></tr>`;
    h += '<tr><th>합계</th>' + DONGS.map((d) => `<th>${nf(cnt(d))}</th>`).join('') + `<th>${nf(F.length)}</th></tr></tbody></table>`;
    document.getElementById('table').innerHTML = h;
  }

  // ── 주의 문구
  const unknownY = F.filter((f) => !f.properties.y).length, unknownU = F.filter((f) => !f.properties.u).length;
  const pct = (n) => ((n / F.length) * 100).toFixed(1) + '%';
  const CAVEAT = {
    year: `원자료의 사용승인일은 ${Math.min(...ys)}–${Math.max(...ys)}년 범위이며, 전체의 ${pct(unknownY)}(${nf(unknownY)}동)는 사용승인일이 비어 있습니다. 최근 준공 건물이 원자료에 반영되지 않았을 수 있습니다.`,
    use: `전체의 ${pct(unknownU)}(${nf(unknownU)}동)는 주용도 정보가 비어 있어 외곽선만 표시합니다. 용도는 건축물대장 기준이라 현재 실제 쓰임(예: 공장을 고친 카페)과 다를 수 있습니다.`,
    old: `사용승인일이 없는 ${nf(unknownY)}동은 노후 여부를 알 수 없어 점선으로만 표시합니다. 원자료에 ${Math.max(...ys) + 1}년 이후 승인 건물이 없어, 최근 신축이 빠진 만큼 노후 비율이 실제보다 높게 나올 수 있습니다.`,
  };

  function render() {
    const feats = F.filter((f) => !state.dong || f.properties.d === state.dong);
    const k = clsKey[state.mode];
    legend.querySelectorAll('.lg').forEach((b) => {
      b.querySelector('.n').textContent = nf(feats.filter((f) => f.properties[k] === b.dataset.c).length);
      b.setAttribute('aria-pressed', String(!state.off[state.mode].has(b.dataset.c)));
    });
    document.getElementById('sub').textContent = `${state.dong || '성수1가1동 · 성수1가2동 · 성수2가1동 · 성수2가3동'} · 건물 ${nf(feats.length)}동`;
    document.getElementById('chartTitle').textContent = cur().chartTitle;
    document.getElementById('note').textContent = cur().note;
    document.getElementById('caveat').textContent = CAVEAT[state.mode];
    ({ year: drawDecades, use: drawUses, old: drawOld })[state.mode](feats);
    styleAll();
  }

  document.getElementById('src').innerHTML =
    `건축물: ${D.source}<br>행정동 경계: <a href="https://github.com/vuski/admdongkor" target="_blank" rel="noopener">vuski/admdongkor</a> (ver20261001)<br>배경지도: OpenStreetMap · Esri World Imagery (인증키 불필요)`;

  setMode(state.mode);
  setBase('light');
})();
</script>
</body>
</html>
